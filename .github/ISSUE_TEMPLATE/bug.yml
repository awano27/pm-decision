name: 不具合
description: 動かない、期待と違う動きをする
title: "[不具合] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **実際のメッセージの本文、社名、人名、ID、URL、トークン、パスを書かないでください。** 公開の場所です。
        下の欄には、`kimeru config show --share`、`kimeru digest --week --share`（どちらも、数値と環境だけを出す）などの出力を貼ってください。
  - type: textarea
    id: what
    attributes:
      label: 何をしたら、どうなりましたか
      description: 実行したコマンドと、出たエラーの 1 行（本文や名前を含む行は、伏せてください）
    validations:
      required: true
  - type: textarea
    id: diag
    attributes:
      label: 診断（本文を含まないもの）
      description: |
        `python -m kimeru config show --share`（パス・組織・サブスクリプションは出ません。秘密は「設定済みか」だけです。
        `--share` の付かない `config show` は、ユーザー名の入ったパスや組織の名前が出るので、貼らないでください）、
        `python -m kimeru schedule status`（タスクの実行行にパスが出るので、その行は伏せてください）、
        Teams の画面操作なら `%LOCALAPPDATA%\kimeru\copilot-diag.txt`（種類・位置・文字数だけで、本文は含みません）。
        ID や社名が入っていないか、貼る前に見てください。
      render: text
  - type: input
    id: version
    attributes:
      label: kimeru の版（`python -m kimeru config show --share` の 1 行目）
