name: tests

on:
  push:
    branches: [main]
  pull_request:

# the jobs only read the checkout; the repository default is read too, this keeps it so wherever the workflow runs
permissions:
  contents: read

# a new push to a pull request cancels the run of its previous push; runs on main queue behind each other
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  windows:
    # kimeru drives Windows Teams through PowerShell / UI Automation: this is the reference platform
    runs-on: windows-latest
    # the suite takes 10-17 minutes here; a hung PowerShell test would otherwise hold the runner for 6 hours
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build backend for the offline packaging test
        run: python -m pip install setuptools wheel
      - name: Unit tests
        run: python -m unittest -q
      - name: Decision-graph validation
        run: python -m kimeru validate

  linux:
    # the decision engine, writers and text checks are platform independent. The tests that start
    # tools/teams-self.ps1 (Windows UI Automation types) skip themselves off Windows; a failure here fails the run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build backend for the offline packaging test
        run: python -m pip install setuptools wheel
      - name: Unit tests
        run: python -m unittest -q
