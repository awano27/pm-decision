[project]
name = "kimeru"
version = "1.1.0"
description = "Event-driven decision graphs for PMs on Windows and Teams, judged by Kev (on this PC) or Jev"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
kimeru = "kimeru.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kimeru"]
